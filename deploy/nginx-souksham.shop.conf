# /etc/nginx/sites-available/souksham.shop
# Reverse-proxy in front of the Next.js app on 127.0.0.1:3000
# After installing, run:
#   sudo ln -sf /etc/nginx/sites-available/souksham.shop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue SSL with certbot (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name souksham.shop www.souksham.shop;

    # Hand off Let's Encrypt HTTP-01 challenges before redirecting in HTTPS phase.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets coming straight out of Next's /_next/static — long-cache them.
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
